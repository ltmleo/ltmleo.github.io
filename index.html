  <body class="locked">
    <section class="office" id="office" aria-label="Escritório 3D">
      <canvas id="scene" aria-hidden="true"></canvas>

      <header class="hud-top">
        <div class="badge">
          <span class="badge-name">LEONARDO MONTERO</span>
          <span class="badge-role" data-i18n="role"></span>
        </div>
        <div class="hud-right">
          <span class="progress" id="progress"></span>
          <button class="lang" id="lang" type="button" aria-label="Mudar idioma / Change language">EN</button>
        </div>
      </header>

      <nav class="hotbar" id="hotbar" aria-label="Objetos"></nav>
      <a class="scroll-cue" href="#story" id="scroll-cue"><span data-i18n-story="cue"></span> <span class="arrow">▼</span></a>

      <aside class="panel" id="panel" role="dialog" aria-modal="false" aria-labelledby="panel-title" hidden>
        <div class="panel-inner">
          <button class="close" id="close" type="button">✕</button>
          <span class="kicker" id="panel-kicker"></span>
          <h2 id="panel-title"></h2>
          <div class="panel-body" id="panel-body"></div>
          <button class="btn story-link" id="story-link" type="button"></button>
        </div>
      </aside>
    </section>

    <main class="story" id="story"></main>

    <div class="tooltip" id="tooltip" role="status" aria-live="polite"></div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <section class="intro" id="intro">
      <div class="intro-card">

        <h1>LEONARDO<br />MONTERO</h1>
        <p class="intro-role" data-i18n="role"></p>
        <button class="start" id="start" type="button" data-i18n="start"></button>
        <p class="intro-hint" data-i18n="introHint"></p>
      </div>
    </section>

    <script type="module" src="/src/main.js"></script>
